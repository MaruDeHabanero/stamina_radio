<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stamina Radio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Pirata+One&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }
        
        #visualizer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            opacity: 0.15;
            pointer-events: none; 
        }

        h1 {
            font-family: 'Pirata One', system-ui;
            font-size: 5rem;
            margin-bottom: 0;
            letter-spacing: 3px;
            animation: colorCycle 8s infinite;
        }
        @keyframes colorCycle {
            0%   { color: #ff3333; }
            25%  { color: #9933ff; }
            50%  { color: #3366ff; }
            75%  { color: #ffff33; }
            100% { color: #ff3333; }
        }
        p {
            font-size: 0.9rem;
            color: #888888;
            margin-bottom: 40px;
            text-align: center;
        }
        .player-container {
            background-color: #1a1a1a;
            padding: 30px 40px;
            width: 320px;
            text-align: center;
            border: 2px solid #333;
        }
        .now-playing-label {
            font-size: 0.75rem;
            color: #555555;
            display: block;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .track-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 25px;
            word-wrap: break-word;
        }
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        button {
            background-color: #ffffff;
            color: #000000;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            border: none;
            padding: 10px 40px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #ff3333;
            color: #ffffff;
        }
        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #888;
        }
        input[type=range] {
            appearance: none;
            width: 100px;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #999999;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            height: 14px;
            width: 8px;
            background: #ffffff;
            margin-top: -5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="visualizer"></canvas>

    <h1>STAMINA RADIO</h1>
    <p>(v2)</p>
    <p>Non-stop 24/7 music featured in the<br>East Coast Stamina / StaminaRPG series.</p>
    <div class="player-container">
        <span class="now-playing-label">Now Playing</span>
        <div class="track-title" id="track-title">Loading current track...</div>
        
        <audio id="radio-player" preload="none" crossorigin="anonymous">
            <source src="https://radiostream.marudehabanero.me/stream" type="audio/mpeg">
        </audio>
        
        <div class="controls-wrapper">
            <button id="play-pause-btn">PLAY</button>
            <div class="volume-wrapper">
                <span>VOL</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
            </div>
        </div>
    </div>

    <script>
        async function fetchMetadata() {
            try {
                const response = await fetch('https://radiostream.marudehabanero.me/status-json.xsl');
                const data = await response.json();
                const source = Array.isArray(data.icestats.source) ? data.icestats.source[0] : data.icestats.source;
                if (source && source.title) {
                    document.getElementById('track-title').innerText = source.title;
                } else {
                    document.getElementById('track-title').innerText = "Oops, something went wrong with el titulo :p";
                }
            } catch (error) {}
        }

        setInterval(fetchMetadata, 30000);
        fetchMetadata();

        const audio = document.getElementById('radio-player');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const volumeSlider = document.getElementById('volume-slider');

        let audioContext, analyser, sourceNode;

        function setupVisualizer() {
            if (audioContext) return; 

            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 128; 

            sourceNode = audioContext.createMediaElementSource(audio);
            sourceNode.connect(analyser);
            analyser.connect(audioContext.destination);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const h1Element = document.querySelector('h1');

            function draw() {
                requestAnimationFrame(draw);
                
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const currentColor = window.getComputedStyle(h1Element).color;
                const rgb = currentColor.match(/\d+/g);

                const barWidth = canvas.width / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * canvas.height; 
                    
                    ctx.fillStyle = `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${dataArray[i] / 255})`;
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    
                    x += barWidth;
                }
            }
            draw();
        }

        playPauseBtn.addEventListener('click', () => {
            setupVisualizer();

            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }

            if (audio.paused) {
                audio.load();
                audio.play();
                playPauseBtn.innerText = 'PAUSE';
                playPauseBtn.style.backgroundColor = '#ff3333';
                playPauseBtn.style.color = '#ffffff';
            } else {
                audio.pause();
                playPauseBtn.innerText = 'PLAY';
                playPauseBtn.style.backgroundColor = '#ffffff';
                playPauseBtn.style.color = '#000000';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });
    </script>
</body>
</html>
